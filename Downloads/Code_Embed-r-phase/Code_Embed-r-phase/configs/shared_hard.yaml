# Configuration for Phase 5: Hard Negative Mining Training

model:
  name: "shared"      # Training the best performing architecture (SharedEncoder) with Hard Negatives
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  num_modalities: 2

data:
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/validation.parquet"
  test_path: "data/processed/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  hard_negatives_file: "data/processed/train_hard_negatives.pt"
  num_hard_negatives: 1  # 1 mined hard negative per positive pair in batch
  batch_size: 128
  num_workers: 0  # 0 on Windows to avoid spawn overhead
  pin_memory: true

training:
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.07
  epochs: 1
  max_steps: 3010
  warmup_steps: 300
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/shared_hard"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed-HardNegatives"
  run_name: "shared-encoder-hard-negatives"
