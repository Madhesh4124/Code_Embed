# Configuration for Phase 4: Model 3 — Separate (Dual) Encoders

model:
  name: "dual"
  vocab_size: 16000
  d_model: 256
  n_layers: 3       # 3 layers per encoder (~6.59M each, ~13.19M total)
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1

data:
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/validation.parquet"
  test_path: "data/processed/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 128
  num_workers: 0  # 0 on Windows to avoid spawn overhead
  pin_memory: true

training:
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.07
  epochs: 5
  max_steps: 10000
  warmup_steps: 500
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/dual"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed-Dual"
  run_name: "dual-encoder"
