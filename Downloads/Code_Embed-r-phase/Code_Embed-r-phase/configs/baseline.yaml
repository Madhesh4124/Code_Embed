# Configuration for Phase 1: BM25 Lexical Baseline Evaluation

data:
  test_path: "data/processed_clean_v2/test.parquet"
  # Set sample_size to null for authoritative full-split evaluation across all clean test queries
  sample_size: null
  seed: 42

bm25:
  k1: 1.5
  b: 0.75
  method: "rank_bm25"
  save_index: false
  index_path: "indices/bm25_test.pkl"

evaluation:
  top_k: 10
  bootstrap_resamples: 1000
  confidence_level: 0.95

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed-Baseline"
  run_name: "BM25-Lexical"

