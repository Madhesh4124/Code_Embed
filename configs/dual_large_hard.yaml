model:
  name: "dual"
  vocab_size: 16000
  d_model: 512
  n_layers: 6
  n_heads: 8
  d_ff: 2048
  max_seq_len: 256
  dropout: 0.1

hard_negatives:
  index_path: "data/hard_negatives/train_bm25_hard_neg_indices.npy"
  init_checkpoint: "checkpoints/dual_large/best_dual.pt"
  k_mined: 50
  max_hard_negs: 5
  hn_weight: 1.0

data:
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/validation.parquet"
  test_path: "data/processed/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 64
  num_workers: 0
  pin_memory: true

training:
  lr: 2.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.07
  epochs: 10
  max_steps: 30000
  warmup_steps: 1000
  log_every_steps: 50
  val_every_steps: 1000
  seed: 42

checkpoint_dir: "checkpoints/dual_large_bm25_hard"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed_Dual_Large_Hard"
  run_name: "dual-large-bm25-hard-negatives"
