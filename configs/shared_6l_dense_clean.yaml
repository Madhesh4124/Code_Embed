# Configuration for Phase 6.5: Model Capacity Scaling (17.0M Shared Encoder)
# Architecture: 6 Layers, d_model = 384, 6 Heads (d_k = 64), d_ff = 1536
# Trained with 1 mined FAISS dense hard negative + in-batch negatives for 4 epochs
# Batch size = 64 (5.46 GB peak VRAM on RTX 4050 6GB GPU)

model:
  name: "shared"
  vocab_size: 16000
  d_model: 384
  n_layers: 6
  n_heads: 6
  d_ff: 1536
  max_seq_len: 256
  dropout: 0.1
  num_modalities: 2

data:
  train_path: "data/processed_clean_v2/train.parquet"
  val_path: "data/processed_clean_v2/validation.parquet"
  test_path: "data/processed_clean_v2/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  hard_negatives_file: "data/processed_clean_v2/train_dense_hard_negatives.pt"
  num_hard_negatives: 1
  batch_size: 64
  num_workers: 0
  pin_memory: true

training:
  lr: 3.5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.05
  epochs: 4
  warmup_ratio: 0.10
  log_every_steps: 100
  val_every_steps: 1000
  seed: 42

checkpoint_dir: "checkpoints/shared_6l_dense_clean"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "codeembed-clean-baselines"
  run_name: "shared-encoder-6l-384d-dense-clean"

