# Configuration for Phase R2-A: Model 1 — Basic Encoder (Clean R-Track)
# Minimal neural baseline without modality embeddings on clean data

model:
  name: "basic"
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1

data:
  train_path: "data/processed_clean_v2/train.parquet"
  val_path: "data/processed_clean_v2/validation.parquet"
  test_path: "data/processed_clean_v2/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 128
  num_workers: 0  # 0 on Windows to avoid process spawn overhead
  pin_memory: true

training:
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.07
  epochs: 2
  warmup_ratio: 0.10  # 10% proportional linear warmup (Protocol v1.1 §2.1)
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/basic_clean"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "codeembed-clean-baselines"
  run_name: "basic-encoder-clean"

