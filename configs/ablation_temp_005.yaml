# Configuration for Phase 6: Ablation 2 — Temperature tau = 0.05
# Tests whether sharper similarity distribution improves or destabilizes InfoNCE alignment

ablation:
  category: "temperature"
  variant: "0.05"

model:
  name: "ablation_shared"
  pooling: "mean"
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  num_modalities: 2

data:
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/validation.parquet"
  test_path: "data/processed/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 128
  max_seq_len: 256
  num_workers: 0
  pin_memory: true

training:
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.05
  epochs: 1
  warmup_steps: 500
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/ablation_temp_005"

mlflow:
  experiment_name: "codeembed-phase6-ablations"
  run_name: "phase6_temp_0.05"

