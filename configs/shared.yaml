# Configuration for Phase 3: Model 2 — Shared Encoder

model:
  name: "shared"
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  num_modalities: 2

data:
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/validation.parquet"
  test_path: "data/processed/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 128
  num_workers: 0  # Set to 0 on Windows to avoid spawn overhead
  pin_memory: true

training:
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.07
  epochs: 5
  max_steps: 10000
  warmup_steps: 500
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/shared"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed-Shared"
  run_name: "shared-encoder"
