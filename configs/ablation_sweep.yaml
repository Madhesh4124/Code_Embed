model:
  name: "dual_ablation"
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1

data:
  train_path: "data/processed_clean_v2/train.parquet"
  val_path: "data/processed_clean_v2/validation.parquet"
  test_path: "data/processed_clean_v2/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 128
  num_workers: 0
  pin_memory: true

training:
  lr: 2.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  epochs: 1
  max_steps: 100000
  warmup_steps: 100
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/ablation"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed_Ablation_Studies"
