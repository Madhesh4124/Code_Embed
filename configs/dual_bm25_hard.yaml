model:
  name: "dual"
  vocab_size: 16000
  d_model: 256
  n_layers: 3
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1

hard_negatives:
  index_path: "data/hard_negatives/train_bm25_hard_neg_indices.npy"
  init_checkpoint: "checkpoints/dual/best_dual.pt"
  k_mined: 50
  max_hard_negs: 5
  hn_weight: 1.0

data:
  train_path: "data/processed_clean_v2/train.parquet"
  val_path: "data/processed_clean_v2/validation.parquet"
  test_path: "data/processed_clean_v2/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 64
  num_workers: 0
  pin_memory: true

training:
  lr: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.07
  epochs: 5
  max_steps: 10000
  warmup_steps: 200
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/dual_bm25_hard"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "CodeEmbed_DualHard"
  run_name: "dual-bm25-hard-negatives"
