# Configuration for Phase R2-D: Hard-Negative Shared Encoder (Clean R-Track)
# Retraining with 1 mined BM25 hard negative + in-batch negatives
# Recipe frozen from Phase R2-B fallback grid: LR = 5.0e-4, Temperature = 0.05

model:
  name: "shared"
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  num_modalities: 2

data:
  train_path: "data/processed_clean_v2/train.parquet"
  val_path: "data/processed_clean_v2/validation.parquet"
  test_path: "data/processed_clean_v2/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  hard_negatives_file: "data/processed_clean_v2/train_hard_negatives.pt"
  num_hard_negatives: 1  # 1 mined hard negative per positive pair in batch
  batch_size: 128
  num_workers: 0  # 0 on Windows to avoid spawn overhead
  pin_memory: true

training:
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.05
  epochs: 2
  warmup_ratio: 0.10  # 10% proportional linear warmup
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/shared_hard_clean"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "codeembed-clean-baselines"
  run_name: "shared-encoder-hard-clean"

