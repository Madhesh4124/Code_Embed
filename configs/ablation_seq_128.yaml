# Configuration for Phase R4: Ablation 2 — Sequence Length L = 128
# Tests whether truncating sequences to 128 tokens retains >98% of MRR with 2x throughput on clean data

ablation:
  category: "seq_len"
  variant: "128"

model:
  name: "ablation_shared"
  pooling: "mean"
  vocab_size: 16000
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  max_seq_len: 128
  dropout: 0.1
  num_modalities: 2

data:
  train_path: "data/processed_clean_v2/train.parquet"
  val_path: "data/processed_clean_v2/validation.parquet"
  test_path: "data/processed_clean_v2/test.parquet"
  tokenizer_path: "tokenizer/tokenizer.json"
  batch_size: 128
  max_seq_len: 128
  num_workers: 0
  pin_memory: true

training:
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  temperature: 0.05
  epochs: 2
  warmup_ratio: 0.10
  log_every_steps: 50
  val_every_steps: 500
  seed: 42

checkpoint_dir: "checkpoints/ablation_seq_128"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "codeembed-clean-ablations"
  run_name: "ablation_seq_len_128"

